[project]
name = "argus-code"
version = "0.6.0"
description = "Local-first dashboard for Claude Code cost, token, tool-usage, and full-text search analytics"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Krish Bhimani" }]
keywords = [
    "claude", "claude-code", "anthropic", "cli", "dashboard",
    "analytics", "tokens", "cost", "usage", "llm", "ai-tools",
    "local-first",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "watchdog>=5.0",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/KrishBhimani/argus-code"
Repository = "https://github.com/KrishBhimani/argus-code.git"
Issues = "https://github.com/KrishBhimani/argus-code/issues"

[project.scripts]
argus = "argus.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "freezegun>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/argus"]

[tool.hatch.build.targets.wheel.force-include]
"dashboard-dist" = "argus/dashboard-dist"
"pricing" = "argus/pricing"
"templates" = "argus/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
addopts = "-ra"
